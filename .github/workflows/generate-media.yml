name: Generate Media (Replicate)

on:
  workflow_dispatch:
    inputs:
      config:
        description: "Fichier config dans configs/ (ex: pub-obsidian.json)"
        required: false
        default: "pub-obsidian.json"
      prompt:
        description: "Prompt direct (optionnel — court-circuite le fichier config)"
        required: false
        default: ""
      model:
        description: "Modèle image (utilisé uniquement si prompt direct)"
        required: false
        default: "nano-banana-pro"
        type: choice
        options:
          - nano-banana-pro
          - nano-banana-2
          - flux-schnell
          - flux-dev
          - sdxl
      style:
        description: "Style visuel (utilisé uniquement si prompt direct)"
        required: false
        default: "cinematic"
        type: choice
        options:
          - cinematic
          - photorealistic
          - documentary
          - abstract
          - poster
          - illustration
          - logo
      animate:
        description: "Animer les images avec Kling 3.0 ?"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      assemble:
        description: "Assembler en vidéo finale avec Shotstack ?"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      shotstack_env:
        description: "Environnement Shotstack"
        required: false
        default: "sandbox"
        type: choice
        options: [sandbox, production]
      skip_generation:
        description: "Sauter étapes 1 et 2 (réutiliser les vidéos déjà ingérées sur Shotstack)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      shotstack_cdn_urls:
        description: "URLs CDN Shotstack séparées par virgule (si skip_generation=true)"
        required: false
        default: ""

  push:
    paths:
      - "configs/*.json"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # ── ÉTAPE 0 : Réutilisation URLs existantes (skip_generation=true) ──────
      - name: "Étape 0 — Réutilisation assets existants"
        if: ${{ github.event.inputs.skip_generation == 'true' }}
        run: |
          mkdir -p output
          URLS="${{ github.event.inputs.shotstack_cdn_urls }}"
          if [ -n "$URLS" ]; then
            echo "$URLS" | tr ',' '\n' > output/kling-urls.txt
            echo ">>> URLs CDN réutilisées:"
            cat output/kling-urls.txt
          else
            echo "WARN: skip_generation=true mais aucune URL fournie."
          fi

      # ── ÉTAPE 1 : Génération images (nano-banana-pro) ──────────────────────
      - name: "Étape 1 — Génération images (nano-banana-pro)"
        if: ${{ github.event.inputs.skip_generation != 'true' }}
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        run: |
          CONFIG="${{ github.event.inputs.config }}"
          PROMPT="${{ github.event.inputs.prompt }}"

          if [ -n "$PROMPT" ]; then
            echo ">>> Prompt direct"
            node generate-images.js \
              --prompt "$PROMPT" \
              --type image \
              --model "${{ github.event.inputs.model }}" \
              --style "${{ github.event.inputs.style }}" \
              --output output
          elif [ -n "$CONFIG" ]; then
            echo ">>> Config: configs/$CONFIG"
            node generate-images.js --config "configs/$CONFIG"
          else
            echo ">>> Config par défaut: configs/pub-obsidian.json"
            node generate-images.js --config "configs/pub-obsidian.json"
          fi

          echo "--- Fichiers générés ---"
          ls -la output/ || echo "Dossier output vide"
          cat output/replicate-urls.txt || echo "Pas de replicate-urls.txt"

      # ── ÉTAPE 2 : Animation Kling 3.0 ────────────────────────────────────
      - name: "Étape 2 — Animation Kling 3.0 (image-to-video)"
        if: ${{ github.event.inputs.animate != 'false' && github.event.inputs.skip_generation != 'true' }}
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        run: |
          CONFIG="${{ github.event.inputs.config }}"
          CONFIG="${CONFIG:-pub-obsidian.json}"

          if [ -f "output/replicate-urls.txt" ]; then
            echo ">>> Animation Kling 3.0 — $(wc -l < output/replicate-urls.txt) images"
            node animate-images.js --config "configs/$CONFIG"
            echo "--- Clips vidéo Kling ---"
            ls -la output/*.mp4 2>/dev/null || echo "Pas de fichiers mp4"
            cat output/kling-urls.txt || echo "Pas de kling-urls.txt"
          else
            echo "WARN: Pas de replicate-urls.txt — étape Kling ignorée"
          fi

      # ── ÉTAPE 3 : Montage Shotstack ────────────────────────────────────────
      - name: "Étape 3 — Montage final Shotstack (MP4 15s 9:16)"
        if: ${{ github.event.inputs.assemble != 'false' }}
        env:
          SHOTSTACK_API_KEY_SANDBOX: ${{ secrets.SHOTSTACK_API_KEY_SANDBOX }}
          SHOTSTACK_API_KEY_PRODUCTION: ${{ secrets.SHOTSTACK_API_KEY_PRODUCTION }}
        run: |
          CONFIG="${{ github.event.inputs.config }}"
          CONFIG="${CONFIG:-pub-obsidian.json}"
          ENV="${{ github.event.inputs.shotstack_env }}"
          ENV="${ENV:-sandbox}"

          echo ">>> Assemblage Shotstack — env: $ENV, config: configs/$CONFIG"
          node assemble-video.js \
            --config "configs/$CONFIG" \
            --env "$ENV" \
            --output output

          echo "--- Résultat final ---"
          ls -la output/*.mp4 2>/dev/null || echo "Pas de MP4 final"
          cat output/final-video-url.txt 2>/dev/null || echo "Pas d'URL finale"

      # ── Upload artefacts ───────────────────────────────────────────────────
      - name: Upload tous les artefacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: obsidian-pub-${{ github.run_number }}
          path: |
            output/*.png
            output/*.jpg
            output/*.mp4
            output/*.txt
          retention-days: 30
