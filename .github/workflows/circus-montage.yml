name: "CIRCUS — Montage Shotstack (scènes 1-20)"

on:
  workflow_dispatch:

jobs:
  montage:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/replicate-media-pipeline-pFAFZ

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Run Shotstack montage
        env:
          SHOTSTACK_API_KEY_SANDBOX: ${{ secrets.SHOTSTACK_API_KEY_SANDBOX }}
        run: node circus-montage.js

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: circus-montage-result
          path: output/circus-lovni/montage-result.json
          retention-days: 7
