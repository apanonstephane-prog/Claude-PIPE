name: Generate Media (Replicate)

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Prompt direct (optionnel — laisse vide pour utiliser un fichier config)"
        required: false
        default: ""
      type:
        description: "Type de média (utilisé uniquement si prompt est renseigné)"
        required: false
        default: "image"
        type: choice
        options: [image, video]
      model:
        description: "Modèle (utilisé uniquement si prompt est renseigné)"
        required: false
        default: "flux-schnell"
        type: choice
        options:
          - flux-schnell
          - flux-dev
          - sdxl
          - nano-banana-pro
          - nano-banana-2
          - ltx-video
          - kling-v2.1
          - kling-v2.1-pro
          - kling-3.0
      style:
        description: "Style visuel (utilisé uniquement si prompt est renseigné)"
        required: false
        default: "cinematic"
        type: choice
        options:
          - cinematic
          - photorealistic
          - documentary
          - abstract
          - poster
          - illustration
          - logo
      config:
        description: "Fichier config batch dans configs/ (ex: pub-obsidian.json). Laisse vide pour tous les lancer."
        required: false
        default: ""
      assemble:
        description: "Assembler en vidéo finale avec Shotstack après la génération ?"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      shotstack_env:
        description: "Environnement Shotstack"
        required: false
        default: "sandbox"
        type: choice
        options: [sandbox, production]

  push:
    paths:
      - "configs/*.json"

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # ── Cas 1 : prompt direct ──────────────────────────────────────────────
      - name: Generate media (prompt direct)
        if: ${{ github.event.inputs.prompt != '' }}
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        run: |
          node generate-images.js \
            --prompt "${{ github.event.inputs.prompt }}" \
            --type "${{ github.event.inputs.type }}" \
            --model "${{ github.event.inputs.model }}" \
            --style "${{ github.event.inputs.style }}" \
            --output output

      # ── Cas 2 : fichier config spécifique ─────────────────────────────────
      - name: Generate media (fichier config spécifique)
        if: ${{ github.event.inputs.prompt == '' && github.event.inputs.config != '' }}
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        run: |
          node generate-images.js --config "configs/${{ github.event.inputs.config }}"

      # ── Cas 3 : tous les fichiers configs/ ────────────────────────────────
      - name: Generate media (tous les configs/)
        if: ${{ github.event.inputs.prompt == '' && github.event.inputs.config == '' }}
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        run: |
          for f in configs/*.json; do
            echo ">>> Traitement de $f..."
            node generate-images.js --config "$f"
          done

      # ── Collecter les URLs générées pour Shotstack ────────────────────────
      - name: Collecter URLs des images générées
        if: ${{ github.event.inputs.assemble != 'false' }}
        run: |
          echo "Recherche des fichiers générés dans output/..."
          ls -la output/ || echo "Dossier output vide"
          # Lister les fichiers PNG générés
          find output/ -name "*.png" -o -name "*.jpg" -o -name "*.webp" 2>/dev/null | sort > output/generated-files.txt
          cat output/generated-files.txt || echo "Aucun fichier trouvé"

      # ── Shotstack : assemblage vidéo finale ───────────────────────────────
      - name: Assembler vidéo finale (Shotstack)
        if: ${{ github.event.inputs.assemble != 'false' }}
        env:
          SHOTSTACK_API_KEY_SANDBOX: ${{ secrets.SHOTSTACK_API_KEY_SANDBOX }}
          SHOTSTACK_API_KEY_PRODUCTION: ${{ secrets.SHOTSTACK_API_KEY_PRODUCTION }}
        run: |
          CONFIG="${{ github.event.inputs.config }}"
          ENV="${{ github.event.inputs.shotstack_env }}"
          ENV="${ENV:-sandbox}"

          # Déterminer le fichier config à utiliser
          if [ -n "$CONFIG" ]; then
            CONFIG_PATH="configs/$CONFIG"
          else
            CONFIG_PATH="configs/pub-obsidian.json"
          fi

          echo ">>> Assemblage Shotstack avec $CONFIG_PATH (env: $ENV)"

          # Récupérer les URLs Replicate depuis les logs (output sauvegardé)
          if [ -f "output/replicate-urls.txt" ]; then
            node assemble-video.js \
              --urls-file output/replicate-urls.txt \
              --config "$CONFIG_PATH" \
              --env "$ENV" \
              --output output
          else
            echo "Pas de fichier replicate-urls.txt — assemblage ignoré."
            echo "Astuce: les URLs Replicate sont temporaires, re-lance avec --urls 'url1,url2,...'"
          fi

      # ── Upload artefacts ───────────────────────────────────────────────────
      - name: Upload artefacts générés
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-generated-${{ github.run_number }}
          path: output/
          retention-days: 30
